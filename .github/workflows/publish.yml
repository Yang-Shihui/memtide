name: Publish to PyPI

# Manual publishing via PyPI Trusted Publishing: before the first run,
# register the project on pypi.org and add a pending publisher
# (owner Yang-Shihui, repo memtide, workflow "publish.yml",
# environment left blank). Afterwards one click publishes the built
# sdist + wheel. No API token needed.
on:
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
